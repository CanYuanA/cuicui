name: Build and deploy Cuicui

on:
  push:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: read

env:
  ACR_REGISTRY: crpi-37e2y9am4lxuf5l4.cn-beijing.personal.cr.aliyuncs.com
  ACR_IMAGE: canyuan/cuicui

concurrency:
  group: cuicui-production
  cancel-in-progress: true

jobs:
  build:
    if: github.ref == 'refs/heads/dev'
    name: Check, build, and publish
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check and build production application
        run: |
          npm run check
          npm run build

      - name: Package versioned deployment assets
        run: tar -czf cuicui-deploy-assets.tgz docker-compose.prod.yml scripts/verify-room-api.mjs

      - name: Upload versioned deployment assets
        uses: actions/upload-artifact@v4
        with:
          name: cuicui-deploy-${{ github.sha }}
          path: cuicui-deploy-assets.tgz
          if-no-files-found: error
          retention-days: 1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Alibaba Cloud Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push immutable image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          provenance: false
          sbom: false
          tags: ${{ env.ACR_REGISTRY }}/${{ env.ACR_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    if: github.ref == 'refs/heads/dev'
    name: Update production service
    needs: build
    runs-on:
      - self-hosted
      - cuicui-deploy
    environment:
      name: production
      url: https://cuicui.iotaceti.top
    env:
      APP_DIRECTORY: /srv/docker/cuicui
      PUBLIC_HEALTH_URL: https://cuicui.iotaceti.top/api/health
      PUBLIC_ORIGIN: https://cuicui.iotaceti.top
    steps:
      # The self-hosted ECS has an unreliable long-lived Git route to GitHub.
      # Fetch the two immutable deployment files as a same-run artifact instead
      # of cloning the repository a second time on the production server.
      - name: Download versioned deployment assets
        uses: actions/download-artifact@v4
        with:
          name: cuicui-deploy-${{ github.sha }}
          path: .

      - name: Extract versioned deployment assets
        shell: bash
        run: |
          set -euo pipefail
          test -f cuicui-deploy-assets.tgz
          tar -xzf cuicui-deploy-assets.tgz
          test -f docker-compose.prod.yml
          test -f scripts/verify-room-api.mjs

      # Keep deployment independent of github.com: the ECS holds its Compose
      # credentials, while the versioned Compose file comes from this commit.
      - name: Validate preprovisioned production configuration
        shell: bash
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail
          echo "runner_host=$(hostname) runner_user=$(id -un)"
          test -d "$APP_DIRECTORY"
          test -f "$APP_DIRECTORY/.env"
          test -f "$APP_DIRECTORY/app.env"
          test -f docker-compose.prod.yml
          grep -q '^SITE_ACCESS_PASSWORD=.' "$APP_DIRECTORY/app.env"
          grep -q '^DEMO_SESSION_SECRET=.' "$APP_DIRECTORY/app.env"
          install -m 0640 docker-compose.prod.yml "$APP_DIRECTORY/docker-compose.yml.next"
          cd "$APP_DIRECTORY"
          IMAGE_TAG="$IMAGE_TAG" docker compose -f docker-compose.yml.next config --quiet

      - name: Pull, start, and verify immutable image
        shell: bash
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail
          test -f "$APP_DIRECTORY/docker-compose.yml"
          test -f "$APP_DIRECTORY/docker-compose.yml.next"
          test -f "$APP_DIRECTORY/.env"
          test -f "$APP_DIRECTORY/app.env"
          cd "$APP_DIRECTORY"

          active_compose="$APP_DIRECTORY/docker-compose.yml"
          next_compose="$APP_DIRECTORY/docker-compose.yml.next"

          wait_for_health() {
            local candidate="$1"
            local container_status="unknown"
            local health_status="starting"
            for attempt in $(seq 1 36); do
              container_status="$(docker inspect --format '{{.State.Status}}' "$candidate")" || return 1
              health_status="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}missing{{end}}' "$candidate")" || return 1
              if [ "$health_status" = "healthy" ]; then return 0; fi
              if [ "$health_status" = "missing" ] || [ "$health_status" = "unhealthy" ] || [ "$container_status" != "running" ]; then return 1; fi
              sleep 5
            done
            return 1
          }

          previous_image_ref=""
          if docker inspect cuicui >/dev/null 2>&1; then
            previous_image_ref="$(docker inspect --format '{{.Config.Image}}' cuicui)"
          fi

          rollback() {
            if [ -z "$previous_image_ref" ] || [[ "$previous_image_ref" != "$repository:"* ]]; then
              echo "No eligible previous Cuicui image is available for rollback." >&2
              return 1
            fi
            local previous_tag
            local rollback_container
            previous_tag="$(printf '%s' "$previous_image_ref" | sed 's/^.*://')"
            echo "Rolling back to the previous Cuicui image." >&2
            IMAGE_TAG="$previous_tag" docker compose --file "$active_compose" up --detach --no-build --remove-orphans app
            rollback_container="$(IMAGE_TAG="$previous_tag" docker compose --file "$active_compose" ps --all --quiet app)"
            test -n "$rollback_container"
            wait_for_health "$rollback_container"
          }

          target_image_ref="$(docker compose --file "$next_compose" config --images | head -n 1)"
          repository="$(printf '%s' "$target_image_ref" | sed 's/:[^:]*$//')"
          test "$target_image_ref" = "$repository:$IMAGE_TAG"

          docker compose --file "$next_compose" pull app
          mkdir -p "$APP_DIRECTORY/data"
          docker run --rm --user 0:0 \
            -v "$APP_DIRECTORY/data:/data" \
            "$target_image_ref" \
            sh -c 'chown 1000:1001 /data && chmod 0770 /data'
          if ! docker compose --file "$next_compose" up --detach --no-build --remove-orphans app; then
            docker compose --file "$next_compose" logs --no-color --tail=120 app || true
            echo "Starting the new Cuicui container failed." >&2
            rollback || true
            exit 1
          fi

          if ! container_id="$(docker compose --file "$next_compose" ps --all --quiet app)" || [ -z "$container_id" ]; then
            echo "The new Cuicui container could not be located." >&2
            rollback || true
            exit 1
          fi
          if ! wait_for_health "$container_id"; then
            docker compose --file "$next_compose" logs --no-color --tail=120 app || true
            echo "The new Cuicui container did not become healthy." >&2
            rollback || true
            exit 1
          fi

          public_healthy=false
          for attempt in $(seq 1 18); do
            if health_json="$(curl --fail --silent --show-error --max-time 10 "$PUBLIC_HEALTH_URL")" && printf '%s' "$health_json" | jq -e '.ok == true and .services.openrouter == true and .services.iflytek == true and .services.access == true' >/dev/null; then
              public_healthy=true
              break
            fi
            sleep 5
          done
          if [ "$public_healthy" != "true" ]; then
            echo "The public TLS/reverse-proxy health check failed." >&2
            rollback || true
            exit 1
          fi

          site_password="$(sed -n 's/^SITE_ACCESS_PASSWORD=//p' "$APP_DIRECTORY/app.env" | head -n 1)"
          site_password="${site_password%$'\r'}"
          if [[ "$site_password" == \"*\" ]] && [ "${#site_password}" -ge 2 ]; then
            site_password="${site_password:1:${#site_password}-2}"
          fi
          if [ -z "$site_password" ]; then
            echo "The site access password is unavailable for production verification." >&2
            rollback || true
            exit 1
          fi
          if ! docker run --rm \
            --env BASE_URL="$PUBLIC_ORIGIN" \
            --env SITE_ACCESS_PASSWORD="$site_password" \
            --volume "$GITHUB_WORKSPACE/scripts/verify-room-api.mjs:/verify-room-api.mjs:ro" \
            --entrypoint node \
            "$target_image_ref" \
            /verify-room-api.mjs; then
            unset site_password
            echo "The production room lifecycle verification failed." >&2
            rollback || true
            exit 1
          fi
          unset site_password

          if ! mv "$next_compose" "$active_compose"; then
            echo "The verified Compose configuration could not be activated." >&2
            rollback || true
            exit 1
          fi

      - name: Remove only unused older Cuicui images
        if: ${{ success() }}
        shell: bash
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail
          cd "$APP_DIRECTORY"
          container_id="$(docker compose ps --all --quiet app)"
          test -n "$container_id"
          test "$(docker inspect --format '{{.State.Health.Status}}' "$container_id")" = "healthy"
          current_image_id="$(docker inspect --format '{{.Image}}' "$container_id")"
          current_image_ref="$(docker inspect --format '{{.Config.Image}}' "$container_id")"
          test "$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.title"}}' "$current_image_id")" = "cuicui"
          [[ "$current_image_ref" == *":$IMAGE_TAG" ]]
          repository="${current_image_ref%:*}"

          declare -A referenced_images=()
          while IFS= read -r used_container_id; do
            [ -n "$used_container_id" ] || continue
            referenced_images["$(docker inspect --format '{{.Image}}' "$used_container_id")"]=1
          done < <(docker ps --all --quiet)

          removed=0
          rollback_kept=false
          while read -r image_ref image_id; do
            [ -n "${image_ref:-}" ] && [ -n "${image_id:-}" ] || continue
            [ "$image_id" != "$current_image_id" ] || continue
            [ -z "${referenced_images[$image_id]:-}" ] || continue
            image_title="$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.title"}}' "$image_id")"
            if [ "$image_title" != "cuicui" ]; then
              echo "Keeping $image_ref because its project label is not Cuicui." >&2
              continue
            fi
            if [ "$rollback_kept" = "false" ]; then
              echo "Keeping $image_ref as the single rollback image."
              rollback_kept=true
              continue
            fi
            if docker image rm "$image_ref"; then removed=$((removed + 1)); fi
          done < <(docker image ls --no-trunc --filter "reference=${repository}:*" --format '{{.Repository}}:{{.Tag}} {{.ID}}')
          echo "Removed $removed older Cuicui image tag(s), kept at most one rollback image, and touched no other repository."
