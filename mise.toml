[tools]
node = "22.23.2"

[env]
npm_config_cache = ".npm-cache"

[tasks.install]
run = "npm ci"

[tasks.dev]
run = "npm run dev"

[tasks.check]
run = "npm run check"

[tasks.build]
run = "npm run build"

[tasks.smoke]
run = "npm run smoke:public"

[tasks.audio-generate]
run = "npm run audio:generate"

[tasks.audio-verify]
run = "npm run audio:verify"

[tasks.room-verify]
run = "npm run room:verify"

[tasks.intervention-verify]
run = "npm run intervention:verify"

[tasks.single-verify]
run = "npm run single:verify"
